[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "webhook-relay"
version = "0.1.0"
description = "PostgreSQL-backed at-least-once webhook delivery with leases and fencing"
requires-python = ">=3.11"
license = {file = "LICENSE"}
readme = "README.md"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "psycopg[binary]>=3.2,<4", "psycopg-pool>=3.2,<4", "httpx>=0.27,<1", "pydantic>=2.9,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
include = ["relay*", "receiver*", "bench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: real PostgreSQL required", "chaos: real processes and PostgreSQL required"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
